name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start > /tmp/ucl-server.log 2>&1 &
          echo $! > /tmp/ucl-server.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/api/status && break
            sleep 1
          done
      - run: npm run browser:inspect -- http://127.0.0.1:4173/provider-tests/turnstile.html
      - run: npm run browser:inspect -- http://127.0.0.1:4173/provider-tests/hcaptcha.html
      - run: npm run browser:inspect -- http://127.0.0.1:4173/provider-tests/recaptcha.html
