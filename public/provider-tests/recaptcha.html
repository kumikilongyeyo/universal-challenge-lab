<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>reCAPTCHA v2 Official Test Fixture</title>
  <style>
    body{font:16px/1.5 system-ui;margin:0;background:#0c0f14;color:#eef2f7}.wrap{max-width:760px;margin:50px auto;padding:24px}.card{background:#151a22;border:1px solid #293240;border-radius:18px;padding:22px;margin:16px 0}code{background:#0a0d12;padding:2px 6px;border-radius:6px}a{color:#9fb6ff}.result{min-height:24px;margin-top:12px;color:#aeb8c8}</style>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <main class="wrap">
    <a href="/">← Lab dashboard</a>
    <h1>Google reCAPTCHA v2 — official test fixture</h1>
    <p>This page uses Google's published v2 automated-test sitekey, which always produces the no-CAPTCHA test behavior and is not a production credential.</p>
    <section class="card">
      <p><code>6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI</code></p>
      <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI" data-callback="recaptchaPass"></div>
      <div id="result" class="result">Waiting for widget…</div>
    </section>
  </main>
  <script>
    function recaptchaPass(token){document.getElementById('result').textContent='Official test callback fired: '+token.slice(0,32)+'…';}
  </script>
</body>
</html>
